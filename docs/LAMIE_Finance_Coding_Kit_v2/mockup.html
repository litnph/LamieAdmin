</script><script>
'use strict';
const KEY='lamie-finance-preview-v1';
const initial={theme:'mint',motion:true,closed:false,checks:{stock:false,ship:false,expenses:false},end:[800000,1800000,1400000],waste:1000000,purchases:[{id:'MH-026',date:'2026-09-28',vendor:'Sạp hoa chợ Hồ Thị Kỷ',group:0,amount:12000000,paid:10000000,doc:'Thiếu chứng từ'},{id:'MH-019',date:'2026-09-16',vendor:'Phụ liệu An Nhiên',group:1,amount:5000000,paid:5000000,doc:'Cần kiểm tra'},{id:'MH-011',date:'2026-09-05',vendor:'Giỏ mây Thanh',group:2,amount:3000000,paid:3000000,doc:'Cần kiểm tra'}],expenses:[{id:'CP-001',name:'Mặt bằng tháng 09',type:'Mặt bằng',amount:5000000,paid:5000000},{id:'CP-002',name:'Lương tháng 09',type:'Nhân công',amount:3000000,paid:3000000},{id:'CP-003',name:'Quảng cáo tháng 09',type:'Marketing',amount:1200000,paid:1000000},{id:'CP-004',name:'Điện, nước tháng 09',type:'Điện nước',amount:800000,paid:0}],log:[]};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{state=structuredClone(initial)}
let page=['overview','reports','purchases','expenses','inventory','themes'].includes(location.hash.slice(1))?location.hash.slice(1):'reports',tab='revenue',filter='all',search='';
const groups=['Hoa tươi','Phụ liệu','Giỏ, bình & phụ kiện'],opening=[500000,1500000,1000000];
const money=n=>Math.round(n).toLocaleString('vi-VN')+' ₫';
const short=n=>(n/1000000).toLocaleString('vi-VN',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(xs,key)=>xs.reduce((n,x)=>n+x[key],0);
function totals(){const buys=sum(state.purchases,'amount'),end=state.end.reduce((a,b)=>a+b,0),use=3000000+buys-end,opex=sum(state.expenses,'amount');return{buys,end,use,cogs:use-state.waste,opex,profit:40000000+2000000-2300000-use-opex,paid:sum(state.purchases,'paid'),expensePaid:sum(state.expenses,'paid'),cash:4000000+38000000-sum(state.purchases,'paid')-sum(state.expenses,'paid')-2100000}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Không lưu được trên trình duyệt; thay đổi chỉ giữ trong phiên này.')}}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',4200)}
function toggleNav(open){document.body.classList.toggle('nav-open',open)}
function go(p){page=p;location.hash=p;toggleNav(false);render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['overview','reports','purchases','expenses','inventory','themes'].includes(p)){page=p;render()}});
function chooseTab(t){tab=t;page='reports';location.hash='reports';render()}
const navs=[['overview','layout-dashboard','Tổng quan'],['reports','chart-no-axes-combined','Báo cáo'],['purchases','shopping-bag','Mua nguyên liệu'],['expenses','wallet','Chi phí vận hành'],['inventory','package','Kiểm kê & chốt kỳ']];
function badge(label,type=''){return `<span class="badge ${type}">${label}</span>`}
function heading(k,title,desc,actions=''){return `<div class="page-head"><div><span class="eyebrow">${k}</span><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function metric(label,value,foot,highlight=false){return `<div class="metric ${highlight?'highlight':''}"><div class="label">${label}</div><div class="value">${value}<span class="unit">₫</span></div><div class="small ${highlight?'muted':''}">${foot}</div></div>`}
function toolbar(){return `<div class="toolbar"><div class="period">Tháng 09, 2026 <span>01/09 — 30/09</span></div><div class="actions">${badge(state.closed?'● Đã chốt kỳ':'● Tạm tính',state.closed?'good':'warn')}<span class="small muted">Đơn vị: VND</span></div></div>`}
function pending(){return Object.values(state.checks).filter(x=>!x).length}
function periodNotice(){return state.closed?`<div class="notice"><div><strong>Kỳ tháng 09 đã được chốt.</strong><p>Số liệu được khóa. Mở lại kỳ và ghi lý do nếu cần điều chỉnh.</p></div><button class="text-btn" onclick="closePeriod()">Xem kỳ đã chốt →</button></div>`:`<div class="notice warning"><div><strong>${pending()?pending()+' bước cần xác nhận trước khi chốt kỳ':'Sẵn sàng chốt kỳ tháng 09'}</strong><p>${state.checks.stock?'Đã xác nhận tồn cuối kỳ':'Chưa xác nhận tồn cuối kỳ'} · ${state.checks.ship?'Đã đối soát ship':'Chưa xác nhận phí ship'} · ${state.checks.expenses?'Đã rà soát chi phí':'Chờ rà soát chi phí vận hành'}</p></div><button class="text-btn" onclick="go('inventory')">Kiểm tra & chốt kỳ →</button></div>`}
function profitRows(){const t=totals();return [['Doanh thu sản phẩm thuần',40000000,''],['Nguyên liệu cho sản phẩm đã bán',-t.cogs,'indent'],['Lãi gộp trước nhân công',40000000-t.cogs,'subtotal'],['Phí giao hàng tính cho khách',2000000,''],['Chi phí giao hàng thực tế',-2300000,'indent'],['Chênh lệch giao hàng',-300000,'subtotal'],['Hao hụt nguyên liệu',-state.waste,''],['Chi phí vận hành (gồm nhân công)',-t.opex,''],['Lợi nhuận quản trị trước thuế',t.profit,'total']]}
function statement(){return `<table class="statement"><tbody>${profitRows().map(([k,v,c])=>`<tr class="${c}"><td>${k}</td><td>${money(v)}</td></tr>`).join('')}</tbody></table>`}
function report(){const t=totals();return heading('TÀI CHÍNH / BÁO CÁO','Hiểu rõ từng đồng lợi nhuận.','Từ doanh thu đến chi phí, một góc nhìn rõ ràng cho tiệm hoa.',`<button class="btn" onclick="exportReport()">↓ Xuất báo cáo</button><button class="btn primary" onclick="closePeriod()">${state.closed?'Xem kỳ đã chốt':'Chốt kỳ tháng 09'}</button>`)+`<div class="tabs" role="tablist" aria-label="Báo cáo">${[['profit','Kết quả kinh doanh'],['cash','Dòng tiền'],['materials','Nguyên liệu & hao hụt'],['tax','Chứng từ & thuế']].map(([k,n])=>`<button role="tab" aria-selected="${tab===k}" class="tab ${tab===k?'active':''}" onclick="chooseTab('${k}')">${n}</button>`).join('')}</div>`+toolbar()+({profit:profit,cash:cash,materials:materials,tax:tax}[tab])()}
function profit(){const t=totals();return periodNotice()+`<div class="metrics">${metric('Doanh thu sản phẩm thuần','40.000.000','<span class="muted">64 đơn đã giao trong kỳ</span>')}${metric('Nguyên liệu tiêu hao',Math.round(t.use).toLocaleString('vi-VN'),'Đã gồm '+short(state.waste)+' triệu hao hụt')}${metric('Chênh lệch giao hàng','−300.000','<span class="negative">Chi thực tế cao hơn phí thu khách</span>')}${metric('Lợi nhuận '+(state.closed?'trước thuế':'tạm tính'),Math.round(t.profit).toLocaleString('vi-VN'),'Biên lợi nhuận '+(t.profit/42000000*100).toFixed(1).replace('.',',')+'% trên tổng doanh thu',true)}</div>
<div class="grid"><section class="card"><div class="card-head"><div><h3>Kết quả kinh doanh</h3><p>Theo ngày giao hàng thực tế · 01–30/09/2026</p></div>${badge('Trước thuế')}</div><div class="card-body">${statement()}<p class="footnote">Giá vốn chỉ gồm nguyên liệu; lương nằm trong chi phí vận hành. Hao hụt được tách một lần.</p></div></section><div><section class="card"><div class="card-head"><div><h3>Doanh thu được phân bổ thế nào?</h3><p>Tổng sản phẩm & giao hàng: 42.000.000 ₫</p></div></div><div class="card-body">${[['Nguyên liệu sản phẩm',t.cogs,'#335f51'],['Vận hành',t.opex,'#7c9c85'],['Ship thực tế',2300000,'#acbfaa'],['Hao hụt',state.waste,'#d6b18b'],['Lợi nhuận trước thuế',t.profit,'#95c889']].map(([label,v,c])=>`<div class="bar-row"><div class="bar-label"><span>${label}</span><b>${short(v)} triệu</b></div><div class="bar-track"><span style="width:${Math.max(0,Math.min(100,v/42000000*100))}%;background:${c}"></span></div></div>`).join('')}<div class="caption">Mua nguyên liệu trong kỳ <b>${money(t.buys)}</b>.<br>Phần chưa dùng vẫn nằm trong tồn kho cuối kỳ.</div></div></section></div></div>
<section class="card"><div class="card-head"><div><h3>Giao hàng: thu khách & chi thực tế</h3><p>Tổng kỳ: thu 2.000.000 ₫ · dự toán 2.100.000 ₫ · thực tế 2.300.000 ₫</p></div><button class="text-btn" onclick="shippingDetail()">Xem đối soát →</button></div>${shippingTable()}<div class="table-footer"><span>3 đơn minh họa trong 64 đơn của kỳ</span><span>Dự toán − thực tế: −200.000 ₫ toàn kỳ</span></div></section>`}
function shippingTable(){return `<div class="table-wrap"><table class="data"><thead><tr><th>ĐƠN HÀNG</th><th>NGÀY GIAO</th><th class="num">PHÍ THU KHÁCH</th><th class="num">SHIP DỰ KIẾN</th><th class="num">SHIP THỰC TẾ</th><th class="num">THU − CHI</th></tr></thead><tbody>${[['LM-1064','30/09',40000,30000,35000],['LM-1063','30/09',30000,35000,45000],['LM-1062','29/09',0,40000,40000]].map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td>${r.slice(2).map(v=>`<td class="num">${money(v)}</td>`).join('')}<td class="num ${r[2]-r[4]<0?'negative':'positive'}">${money(r[2]-r[4])}</td></tr>`).join('')}</tbody></table></div>`}
function cash(){const t=totals(),out=t.paid+t.expensePaid+2100000;return `<div class="notice"><div><strong>Tiền về và lợi nhuận là hai góc nhìn khác nhau.</strong><p>Mỗi khoản thu/chi ghi theo ngày thanh toán thực tế. Tiền cọc không cộng lại khi khách thanh toán phần còn lại.</p></div></div><div class="metrics">${metric('Số dư đầu kỳ','4.000.000','Tiền mặt & tài khoản')}${metric('Thực thu trong kỳ','38.000.000','20 triệu tiền cọc + 18 triệu còn lại')}${metric('Thực chi trong kỳ',out.toLocaleString('vi-VN'),'Theo các khoản đã thanh toán')}${metric('Số dư cuối kỳ',t.cash.toLocaleString('vi-VN'),'Đầu kỳ + thực thu − thực chi',true)}</div><div class="grid"><section class="card"><div class="card-head"><h3>Thu & chi trong tháng</h3>${badge('Ngày nhận / trả tiền')}</div><div class="card-body"><table class="statement">${[['Thu cọc từ khách',20000000],['Thu phần thanh toán còn lại',18000000],['Trả nhà cung cấp nguyên liệu',-t.paid],['Trả chi phí vận hành',-t.expensePaid],['Trả đơn vị giao hàng',-2100000],['Dòng tiền thuần',38000000-out]].map(([k,v],i)=>`<tr class="${i===5?'total':''}"><td>${k}</td><td>${money(v)}</td></tr>`).join('')}</table></div></section><section class="card"><div class="card-head"><h3>Các khoản còn phải thu / trả</h3></div><div class="card-body">${[['Khách còn nợ',4000000],['Nợ nhà cung cấp',t.buys-t.paid],['Phí ship chưa trả',200000],['Chi phí vận hành chưa trả',t.opex-t.expensePaid]].map(([k,v])=>`<div class="stat-list"><span>${k}</span><b>${money(v)}</b></div>`).join('')}<div class="divider"></div><div class="caption">Ví dụ này có 42 triệu doanh thu và 38 triệu đã thu từ các đơn trong kỳ. Chưa có giao dịch góp vốn, rút vốn hoặc vay.</div></div></section></div>`}
function stockTable(edit=false){return `<div class="table-wrap"><table class="data"><thead><tr><th>NHÓM NGUYÊN LIỆU</th><th class="num">TỒN ĐẦU</th><th class="num">MUA VÀO</th><th class="num">TỒN CUỐI ${edit?'(NHẬP GIÁ VỐN)':''}</th><th class="num">TIÊU HAO</th></tr></thead><tbody>${groups.map((g,i)=>{let buy=sum(state.purchases.filter(x=>x.group===i),'amount');return `<tr><td><strong>${g}</strong><small>${i===0?'Gồm hoa trong bó chưa giao':'Kiểm kê theo giá mua'}</small></td><td class="num">${money(opening[i])}</td><td class="num">${money(buy)}</td><td class="num">${edit?`<input aria-label="Tồn cuối ${g}" class="table-input" name="end${i}" type="number" min="0" max="${opening[i]+buy}" step="1000" value="${state.end[i]}" required>`:money(state.end[i])}</td><td class="num">${money(opening[i]+buy-state.end[i])}</td></tr>`}).join('')}</tbody></table></div>`}
function formula(){const t=totals();return `<div class="formula"><div><span>Tồn đầu kỳ</span><strong>3 triệu</strong></div><span>+</span><div><span>Mua vào thuần</span><strong>${short(t.buys)} triệu</strong></div><span class="minus">−</span><div><span>Tồn cuối kỳ</span><strong>${short(t.end)} triệu</strong></div><span class="eq">=</span><div class="result"><span>Tiêu hao trong kỳ</span><strong>${short(t.use)} triệu</strong></div></div>`}
function materials(){const t=totals();return `<div class="notice"><div><strong>Tính theo nguyên liệu đã tiêu hao, không trừ toàn bộ tiền mua.</strong><p>Tồn cuối gồm nguyên liệu còn dùng được và giá vốn nguyên liệu trong các bó chưa giao.</p></div><button class="text-btn" onclick="go('inventory')">Mở kiểm kê →</button></div><section class="card"><div class="card-head"><div><h3>Từ nhập hàng đến sử dụng</h3><p>Giá trị tồn theo giá vốn · không phải giá bán</p></div>${badge(state.checks.stock?'Đã xác nhận':'Chờ xác nhận',state.checks.stock?'good':'warn')}</div>${formula()}${stockTable()}<div class="table-footer"><span>Tổng tiêu hao đã bao gồm hao hụt</span><b>${money(t.use)}</b></div></section><div class="grid" style="margin-top:22px"><section class="card"><div class="card-head"><h3>Phân loại phần tiêu hao</h3></div><div class="card-body"><div class="stat-list"><span>Nguyên liệu cho sản phẩm đã bán</span><b>${money(t.cogs)}</b></div><div class="stat-list"><span>Hoa hỏng / hao hụt đã ghi nhận</span><b>${money(state.waste)}</b></div><p class="footnote">Không có sử dụng riêng, biếu tặng hoặc điều chỉnh khác trong dữ liệu mẫu.</p></div></section><section class="card"><div class="card-head"><h3>Giữ việc kiểm kê nhẹ nhàng</h3></div><div class="card-body"><p>Hoa tươi: kiểm tra mỗi tuần.<br>Phụ liệu, giỏ và bình: kiểm kê cuối tháng.</p><div class="divider"></div><p>Tồn cuối tháng này chuyển thành tồn đầu tháng sau. Không cộng lặp lại các lần kiểm kê tuần.</p></div></section></div>`}
function tax(){const missing=state.purchases.filter(x=>x.doc==='Thiếu chứng từ').length;return `<div class="notice warning"><div><strong>Chuẩn bị dữ liệu cho hộ kinh doanh</strong><p>Chưa thiết lập phương pháp thuế. Bản mẫu không tính thuế phải nộp và không tự xác nhận chi phí được trừ.</p></div></div><div class="metrics">${metric('Doanh thu cần đối soát','42.000.000','Gồm sản phẩm và phí giao hàng')}${metric('Tổng mua nguyên liệu',totals().buys.toLocaleString('vi-VN'),state.purchases.length+' phiếu mua trong kỳ')}${metric('Phiếu thiếu chứng từ',sum(state.purchases.filter(x=>x.doc==='Thiếu chứng từ'),'amount').toLocaleString('vi-VN'),missing+' phiếu cần bổ sung')}${metric('Chi phí được trừ','—','Chờ xác định phương pháp thuế & kiểm tra hồ sơ',true)}</div><section class="card"><div class="card-head"><div><h3>Hồ sơ mua hàng cần hoàn thiện</h3><p>Phiếu mua ở chợ và bảng kê cần được kiểm tra điều kiện áp dụng.</p></div><button class="btn" onclick="exportPurchases()">↓ Xuất danh sách</button></div><div class="table-wrap"><table class="data"><thead><tr><th>PHIẾU / NGƯỜI BÁN</th><th class="num">GIÁ TRỊ</th><th>CHỨNG TỪ</th><th>THAO TÁC</th></tr></thead><tbody>${state.purchases.map(x=>`<tr><td><strong>${esc(x.vendor)}</strong><small>${x.id} · ${x.date}</small></td><td class="num">${money(x.amount)}</td><td>${badge(x.doc,x.doc==='Thiếu chứng từ'?'warn':'')}</td><td><button class="text-btn" onclick="purchaseDetail('${x.id}')">Xem hồ sơ</button></td></tr>`).join('')}</tbody></table></div></section><p class="footnote">Giữ riêng ngày hóa đơn, ngày giao hàng và ngày thanh toán. Số liệu quản trị không tự động trở thành số liệu kê khai thuế.</p>`}
function purchases(){const t=totals();return heading('VẬN HÀNH / MUA HÀNG','Mua nguyên liệu','Nhập tổng theo nhóm. Giữ lại chứng từ, kiểm kê giá trị còn lại cuối kỳ.',`<button class="btn" onclick="exportPurchases()">↓ Xuất danh sách</button><button class="btn primary" ${state.closed?'disabled':''} onclick="purchaseForm()">+ Thêm phiếu mua</button>`)+toolbar()+`<div class="metrics">${metric('Mua trong kỳ',t.buys.toLocaleString('vi-VN'),state.purchases.length+' phiếu mua')}${metric('Đã thanh toán',t.paid.toLocaleString('vi-VN'),'Ghi nhận trong dòng tiền')}${metric('Còn phải trả',(t.buys-t.paid).toLocaleString('vi-VN'),'Công nợ nhà cung cấp')}${metric('Tồn cuối kỳ',t.end.toLocaleString('vi-VN'),state.checks.stock?'Đã xác nhận kiểm kê':'Chờ xác nhận kiểm kê',true)}</div><section class="card"><div class="card-head"><h3>Phiếu mua nguyên liệu</h3><input class="search" aria-label="Tìm người bán hoặc mã phiếu" placeholder="Tìm người bán hoặc mã phiếu…" value="${esc(search)}" oninput="search=this.value;renderPurchaseRows()"></div><div class="table-wrap"><table class="data"><thead><tr><th>PHIẾU MUA / NGƯỜI BÁN</th><th>NHÓM</th><th class="num">TỔNG TIỀN</th><th class="num">CÒN NỢ</th><th>CHỨNG TỪ</th><th></th></tr></thead><tbody id="purchase-rows"></tbody></table></div><div class="table-footer"><span>Mua nguyên liệu không tự động là chi phí của hàng đã bán.</span><button class="text-btn" onclick="go('inventory')">Đến kiểm kê →</button></div></section>`}
function renderPurchaseRows(){const e=document.getElementById('purchase-rows');if(!e)return;const rows=state.purchases.filter(x=>(x.id+' '+x.vendor).toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi')));e.innerHTML=rows.length?rows.map(x=>`<tr><td><strong>${esc(x.vendor)}</strong><small>${x.id} · ${x.date}</small></td><td>${groups[x.group]}</td><td class="num">${money(x.amount)}</td><td class="num">${money(x.amount-x.paid)}</td><td>${badge(x.doc,x.doc==='Thiếu chứng từ'?'warn':'')}</td><td><button class="text-btn" onclick="purchaseDetail('${x.id}')">Chi tiết</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Không tìm thấy phiếu mua phù hợp.</td></tr>'}
function expenses(){const t=totals();return heading('VẬN HÀNH / CHI PHÍ','Chi phí vận hành','Ghi nhận theo kỳ phát sinh. Theo dõi riêng phần đã thanh toán.',`<button class="btn primary" ${state.closed?'disabled':''} onclick="expenseForm()">+ Thêm chi phí</button>`)+toolbar()+`<div class="metrics">${metric('Chi phí của kỳ',t.opex.toLocaleString('vi-VN'),'Đã tính vào kết quả kinh doanh')}${metric('Đã thanh toán',t.expensePaid.toLocaleString('vi-VN'),'Đã tính vào dòng tiền chi')}${metric('Còn phải trả',(t.opex-t.expensePaid).toLocaleString('vi-VN'),'Chưa thanh toán')}${metric('Lợi nhuận tạm tính',t.profit.toLocaleString('vi-VN'),'Sau nguyên liệu, giao hàng & vận hành',true)}</div><section class="card"><div class="card-head"><h3>Chi phí tháng 09</h3>${badge('Không gồm mua nguyên liệu')}</div><div class="table-wrap"><table class="data"><thead><tr><th>NỘI DUNG</th><th>PHÂN LOẠI</th><th>KỲ PHÁT SINH</th><th class="num">GIÁ TRỊ</th><th class="num">ĐÃ TRẢ</th><th>TRẠNG THÁI</th></tr></thead><tbody>${state.expenses.map(x=>`<tr><td><strong>${esc(x.name)}</strong><small>${x.id}</small></td><td>${esc(x.type)}</td><td>Tháng 09/2026</td><td class="num">${money(x.amount)}</td><td class="num">${money(x.paid)}</td><td>${badge(x.paid===x.amount?'Đã thanh toán':x.paid?'Trả một phần':'Chưa thanh toán',x.paid===x.amount?'good':'warn')}</td></tr>`).join('')}</tbody></table></div></section><div class="notice" style="margin-top:20px"><div><strong>Đúng nhóm chi phí, đúng lợi nhuận.</strong><p>Hoa và phụ liệu nhập tại Mua nguyên liệu. Rút tiền cá nhân, trả gốc vay và mua thiết bị dài hạn cần theo dõi riêng.</p></div></div>`}
function inventory(){return heading('VẬN HÀNH / KIỂM KÊ','Chốt số liệu, an tâm nhìn lợi nhuận.','Kiểm kê theo giá vốn và xác nhận các khoản còn thiếu trước khi chốt tháng.',`<button class="btn primary" onclick="closePeriod()">${state.closed?'Xem kỳ đã chốt':'Kiểm tra & chốt kỳ'}</button>`)+toolbar()+periodNotice()+`<section class="card"><div class="card-head"><div><h3>Kiểm kê cuối tháng 09</h3><p>Nhập giá trị nguyên liệu còn lại tại ngày 30/09/2026.</p></div>${badge(state.checks.stock?'Đã xác nhận':'Bản kiểm kê nháp',state.checks.stock?'good':'warn')}</div>${formula()}<form onsubmit="saveStock(event)"><fieldset style="border:0;margin:0;padding:0" ${state.closed?'disabled':''}>${stockTable(true)}<div class="card-body"><div class="fields"><label class="field">Hao hụt trong kỳ (đã nằm trong tiêu hao)<input name="waste" type="number" min="0" step="1000" value="${state.waste}" required></label><label class="field">Ghi chú kiểm kê<input name="note" placeholder="Ví dụ: hoa hỏng đã loại khỏi tồn cuối" maxlength="200" value="${esc(state.stockNote||'')}"></label></div><div class="caption">Tồn cuối phải gồm phần nguyên liệu trong bó hoa đã làm nhưng chưa giao. Dữ liệu mẫu không có sử dụng riêng hoặc biếu tặng. Cột tiêu hao cập nhật sau khi lưu.</div><div class="form-actions"><button type="submit" class="btn primary">Lưu & xác nhận kiểm kê</button></div></div></fieldset></form></section><div class="grid" style="margin-top:22px"><section class="card"><div class="card-head"><h3>Đối soát trước khi chốt</h3><span class="small muted">${3-pending()}/3 hoàn tất</span></div><div class="card-body">${checksMarkup(false)}</div></section><section class="card"><div class="card-head"><h3>Lịch sử kỳ báo cáo</h3></div><div class="card-body">${state.log.length?state.log.slice(-4).reverse().map(x=>`<div class="stat-list"><span>${esc(x)}</span></div>`).join(''):'<div class="caption">Chưa có thao tác chốt kỳ. Các số liệu hiện tại là dữ liệu mẫu chưa được xác nhận.</div>'}<p class="footnote">Chốt kỳ khóa nhập liệu. Mở lại kỳ cần ghi lý do và giữ lịch sử.</p></div></section></div>`}
function checksMarkup(inModal){return [['stock','Kiểm kê nguyên liệu','Xác nhận giá vốn tồn cuối và hao hụt.'],['ship','Đối soát giao hàng','Đã kiểm tra 2,3 triệu phí thực tế trong kỳ.'],['expenses','Rà soát chi phí vận hành','Đã ghi đủ lương, mặt bằng và các chi phí kỳ này.']].map(([k,n,d])=>`<label class="check-row"><input type="checkbox" ${state.checks[k]?'checked':''} ${state.closed||k==='stock'?'disabled':''} onchange="setCheck('${k}',this.checked,${inModal})"><div><strong>${n}</strong><p>${d}</p></div>${badge(state.checks[k]?'Hoàn tất':k==='stock'?'Lưu kiểm kê':'Chờ kiểm tra',state.checks[k]?'good':'warn')}</label>`).join('')}
function overview(){const t=totals();return heading('LAMIE / TỔNG QUAN','Một tháng kinh doanh rõ ràng hơn.','Theo dõi kỳ tháng 09/2026 — từ nhập hàng đến lợi nhuận.')+`<div class="hero"><div><span class="eyebrow" style="color:inherit">GÓC NHÌN CỦA CHỦ TIỆM</span><h2>Bán được bao nhiêu. Giữ lại bao nhiêu.</h2><p>Mỗi khoản chi có đúng chỗ, mỗi kỳ báo cáo có đủ dữ liệu.</p></div><button class="btn" onclick="chooseTab('profit')">Xem báo cáo lợi nhuận →</button></div><div class="metrics">${metric('Doanh thu sản phẩm','40.000.000','64 đơn đã giao')}${metric('Lợi nhuận '+(state.closed?'trước thuế':'tạm tính'),t.profit.toLocaleString('vi-VN'),state.closed?'Kỳ đã chốt':'Chờ xác nhận cuối kỳ',true)}${metric('Tiền hiện có',t.cash.toLocaleString('vi-VN'),'Theo số dư cuối kỳ mẫu')}${metric('Khách còn nợ','4.000.000','Cần thu từ các đơn đã giao')}</div>${periodNotice()}<div class="overview-grid">${[['01','Ghi nhận mua hàng','Nhập tổng theo nhóm, lưu chứng từ và số đã thanh toán.','purchases','Mở mua nguyên liệu'],['02','Kiểm kê cuối kỳ','Xác nhận nguyên liệu còn lại để tính đúng phần đã dùng.','inventory','Mở kiểm kê'],['03','Hoàn thiện hồ sơ','Rà soát chứng từ trước khi chuyển dữ liệu cho kế toán.','tax','Xem hồ sơ thuế']].map(([n,title,desc,p,label])=>`<section class="card overview-step"><div class="step-num">BƯỚC ${n}</div><h3>${title}</h3><p>${desc}</p><button class="text-btn" onclick="${p==='tax'?"chooseTab('tax')":`go('${p}')`}">${label} →</button></section>`).join('')}</div>`}
const themes=[['mint','Mint Calm','Bạc hà tĩnh','#042f32','#f3f6f3'],['violet','Violet Mist','Sương tím','#3d007a','#f0eff6'],['lime','Lime Grove','Vườn nắng','#2f3a1d','#f6f6ee'],['glass','Violet Glass','Tím trong veo','#5f2cff','#edf6ff'],['cobalt','Cobalt Sand','Xanh & cát','#0038ff','#ffd8b8'],['noir','Lime Noir','Lime đêm','#c8ff00','#06110d']];
function themePage(){return heading('CÁ NHÂN HÓA / CHỦ ĐỀ','Không gian theo cảm hứng của bạn.','Đổi toàn bộ nền, sidebar, thẻ và màu chữ. Giữ nguyên vị trí công việc.')+`<div class="theme-grid">${themes.map(([id,n,vi,a,b])=>`<button class="theme-card ${state.theme===id?'active':''}" onclick="setTheme('${id}')" aria-pressed="${state.theme===id}"><div class="theme-preview" style="background:${b}"><i style="background:${a}"></i><span></span></div><strong>${n} ${state.theme===id?'✓':''}</strong><small>${vi}</small></button>`).join('')}</div><section class="card" style="margin-top:22px"><div class="card-body" style="padding-top:10px"><label class="check-row"><input type="checkbox" ${state.motion?'checked':''} onchange="state.motion=this.checked;save();window.LamieMotion?.setEnabled(state.motion)"><div><strong>Chuyển động nhẹ trên sidebar</strong><p>Lucide Animated chỉ chạy khi tương tác. Tôn trọng thiết lập giảm chuyển động của thiết bị.</p></div></label><p class="footnote">Bấm một chủ đề để áp dụng ngay cho bản mẫu và ghi nhớ trên trình duyệt.</p></div></section>`}
function setTheme(t){state.theme=t;save();render()}
function render(){document.documentElement.dataset.theme=state.theme;document.getElementById('navigation').innerHTML=navs.map(([p,i,n])=>`<button class="navitem ${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}')"><i data-lucide="${i}"></i>${n}${page===p?'<span class="dot"></span>':''}</button>`).join('');document.getElementById('crumb').textContent=navs.find(x=>x[0]===page)?.[2]||'Chủ đề giao diện';document.getElementById('side-status').textContent=state.closed?'● Đã chốt kỳ':'● Chờ chốt kỳ';document.getElementById('app').innerHTML=({reports:report,overview,purchases,expenses,inventory,themes:themePage}[page])();renderPurchaseRows();window.LamieMotion?.enhance(document.getElementById('sidebar'));window.LamieMotion?.setEnabled(state.motion)}
let dialogReturnFocus;
function openDialog(title,body){dialogReturnFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;const d=document.getElementById('dialog');if(!d.open)d.showModal()}
function closeDialog(){document.getElementById('dialog').close();dialogReturnFocus?.focus()}
document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleNav(false)});
function purchaseForm(){if(state.closed)return;openDialog('Thêm phiếu mua nguyên liệu',`<p>Phiếu mới thuộc tháng 09/2026 của bản mẫu. Khoản mua và số đã trả được cập nhật riêng.</p><form onsubmit="addPurchase(event)"><div class="fields"><label class="field">Ngày mua<input name="date" type="date" min="2026-09-01" max="2026-09-30" value="2026-09-30" required></label><label class="field">Nhóm nguyên liệu<select name="group">${groups.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></label></div><label class="field">Người bán / sạp hàng<input name="vendor" placeholder="Tên người bán hoặc sạp tại chợ" maxlength="100" required></label><div class="fields"><label class="field">Tổng tiền mua (₫)<input name="amount" type="number" min="1000" step="1000" required></label><label class="field">Đã trả trong tháng (₫)<input name="paid" type="number" min="0" step="1000" value="0" required></label></div><label class="field">Tình trạng hồ sơ<select name="doc"><option>Thiếu chứng từ</option><option>Cần kiểm tra</option><option>Có hóa đơn — chờ kiểm tra</option></select></label><div class="caption">Sau khi thêm phiếu, cần kiểm kê lại phần mua còn tồn. Số đã trả giả định thanh toán ngay ngày mua trong bản mẫu.</div><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">Hủy</button><button class="btn primary">Lưu phiếu mua</button></div></form>`)}
function addPurchase(e){e.preventDefault();if(state.closed)return;const f=new FormData(e.target),amount=Number(f.get('amount')),paid=Number(f.get('paid'));if(paid>amount)return toast('Số đã trả không được lớn hơn tổng tiền mua.');state.purchases.unshift({id:'MH-'+Date.now().toString().slice(-6),date:f.get('date'),vendor:f.get('vendor').trim(),group:Number(f.get('group')),amount,paid,doc:f.get('doc')});state.checks.stock=false;save();closeDialog();render();toast('Đã thêm phiếu mua mẫu. Hãy cập nhật tồn cuối kỳ.')}
function purchaseDetail(id){const x=state.purchases.find(p=>p.id===id);openDialog('Hồ sơ '+x.id,`<div class="caption">${esc(x.vendor)} · ${x.date}<br>${groups[x.group]} · Tổng tiền ${money(x.amount)} · Còn nợ ${money(x.amount-x.paid)}</div><form onsubmit="saveDoc(event,'${x.id}')"><fieldset style="border:0;padding:0" ${state.closed?'disabled':''}><label class="field">Thông tin người bán / địa chỉ sạp<input name="address" value="${esc(x.address||'')}" placeholder="Chợ, số sạp, tên người bán" maxlength="200"></label><label class="field">Tham chiếu chứng từ<input name="reference" value="${esc(x.reference||'')}" placeholder="Số phiếu giấy / số hóa đơn, ngày chứng từ" maxlength="150"></label><label class="field">Tình trạng hồ sơ<select name="doc">${['Thiếu chứng từ','Cần kiểm tra','Có hóa đơn — chờ kiểm tra'].map(v=>`<option ${x.doc===v?'selected':''}>${v}</option>`).join('')}</select></label><div class="caption">Bản mẫu chỉ lưu ghi chú hồ sơ, chưa tải tệp chứng từ. Trạng thái này không xác nhận chi phí được trừ khi kê khai.</div><div class="form-actions"><button class="btn primary">Lưu thông tin mẫu</button></div></fieldset></form>`)}
function saveDoc(e,id){e.preventDefault();if(state.closed)return;const f=new FormData(e.target),x=state.purchases.find(p=>p.id===id);x.address=f.get('address');x.reference=f.get('reference');x.doc=f.get('doc');save();closeDialog();render();toast('Đã lưu ghi chú hồ sơ.')}
function expenseForm(){if(state.closed)return;openDialog('Thêm chi phí vận hành',`<p>Chỉ ghi phần chi phí thuộc kỳ tháng 09/2026.</p><form onsubmit="addExpense(event)"><label class="field">Nội dung chi phí<input name="name" required maxlength="100" placeholder="Ví dụ: quảng cáo tuần cuối tháng"></label><label class="field">Phân loại<select name="type"><option>Marketing</option><option>Nhân công</option><option>Mặt bằng</option><option>Điện nước</option><option>Chi phí vận hành khác</option></select></label><div class="fields"><label class="field">Chi phí kỳ này (₫)<input name="amount" type="number" min="1000" step="1000" required></label><label class="field">Đã trả trong kỳ (₫)<input name="paid" type="number" min="0" step="1000" value="0" required></label></div><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">Hủy</button><button class="btn primary">Lưu chi phí</button></div></form>`)}
function addExpense(e){e.preventDefault();if(state.closed)return;let f=new FormData(e.target),amount=Number(f.get('amount')),paid=Number(f.get('paid'));if(paid>amount)return toast('Số đã trả không được lớn hơn chi phí.');state.expenses.push({id:'CP-'+Date.now().toString().slice(-6),name:f.get('name').trim(),type:f.get('type'),amount,paid});state.checks.expenses=false;save();closeDialog();render();toast('Đã cập nhật chi phí và dòng tiền mẫu.')}
function saveStock(e){e.preventDefault();if(state.closed)return;const f=new FormData(e.target),end=groups.map((_,i)=>Number(f.get('end'+i))),waste=Number(f.get('waste')),use=3000000+totals().buys-end.reduce((a,b)=>a+b,0);if(waste>use)return toast('Hao hụt không được lớn hơn tổng nguyên liệu tiêu hao.');state.end=end;state.waste=waste;state.stockNote=f.get('note');state.checks.stock=true;state.log.push('Xác nhận kiểm kê: tồn '+money(totals().end));save();render();toast('Đã lưu kiểm kê và cập nhật lợi nhuận.')}
function setCheck(k,v,modal){if(state.closed)return;state.checks[k]=v;save();render();if(modal)closePeriod()}
function closePeriod(){if(state.closed){openDialog('Kỳ tháng 09 đã chốt',`<div class="notice"><strong>Lợi nhuận quản trị trước thuế: ${money(totals().profit)}</strong></div><p>Các thao tác nhập liệu đã được khóa trong kỳ này.</p><form onsubmit="reopen(event)"><label class="field">Lý do mở lại kỳ<input name="reason" required minlength="5" maxlength="200" placeholder="Ví dụ: bổ sung chi phí điện tháng 09"></label><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">Đóng</button><button class="btn primary">Mở lại kỳ mẫu</button></div></form>`);return}openDialog('Chốt kỳ tháng 09/2026',`<p>Kiểm tra đủ ba bước để khóa số liệu của kỳ.</p>${checksMarkup(true)}<div class="mini-grid"><div><span class="small muted">Tồn cuối kỳ</span><strong>${money(totals().end)}</strong></div><div><span class="small muted">Lợi nhuận trước thuế</span><strong>${money(totals().profit)}</strong></div></div><div class="caption">Chốt báo cáo quản trị không đồng nghĩa đã hoàn thành kê khai thuế.</div><div class="form-actions"><button class="btn" onclick="closeDialog();go('inventory')">Mở kiểm kê</button><button class="btn primary" ${pending()?'disabled':''} onclick="confirmClose()">Xác nhận chốt kỳ</button></div>`)}
function confirmClose(){if(pending())return;state.closed=true;state.log.push('Chốt kỳ tháng 09 · '+new Date().toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}));save();closeDialog();render();toast('Đã chốt kỳ mẫu. Số liệu được khóa.')}
function reopen(e){e.preventDefault();const reason=new FormData(e.target).get('reason').trim();if(reason.length<5)return;state.closed=false;state.checks={stock:false,ship:false,expenses:false};state.log.push('Mở lại kỳ: '+reason);save();closeDialog();render();toast('Đã mở lại kỳ và lưu lý do điều chỉnh.')}
function shippingDetail(){openDialog('Đối soát giao hàng',`<div class="mini-grid"><div><span class="small muted">Chênh lệch thu − chi</span><strong class="negative">−300.000 ₫</strong></div><div><span class="small muted">Dự toán − thực tế</span><strong class="negative">−200.000 ₫</strong></div></div><p>Toàn kỳ: thu khách 2 triệu, dự toán 2,1 triệu, chi thực tế 2,3 triệu.</p><div style="margin-top:20px">${shippingTable()}</div><p class="footnote">Bảng hiển thị 3 đơn minh họa. Xác nhận dưới đây áp dụng số tổng hợp của toàn kỳ.</p><div class="form-actions"><button class="btn primary" ${state.closed?'disabled':''} onclick="setCheck('ship',true,false);closeDialog();toast('Đã xác nhận phí ship toàn kỳ mẫu.')">Xác nhận đã đối soát</button></div>`)}
function csv(name,rows){const content='\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Đã xuất dữ liệu mẫu CSV.')}
function exportReport(){const t=totals();let rows=tab==='profit'?[['Chỉ tiêu','VND'],...profitRows().map(([k,v])=>[k,v])]:tab==='cash'?[['Chỉ tiêu','VND'],['Số dư đầu',4000000],['Thu cọc',20000000],['Thu phần còn lại',18000000],['Trả nguyên liệu',t.paid],['Trả vận hành',t.expensePaid],['Trả ship',2100000],['Số dư cuối',t.cash]]:tab==='materials'?[['Nhóm','Tồn đầu','Mua','Tồn cuối'],...groups.map((g,i)=>[g,opening[i],sum(state.purchases.filter(x=>x.group===i),'amount'),state.end[i]])]:null;if(!rows)return exportPurchases();csv('Lamie-'+tab+'-2026-09.csv',[['Dữ liệu mẫu','Tháng 09/2026'],['Trạng thái',state.closed?'Đã chốt':'Tạm tính'],...rows])}
function exportPurchases(){csv('Lamie-mua-hang-2026-09.csv',[['Mã','Ngày','Người bán','Nhóm','Tổng tiền','Đã trả','Chứng từ','Ghi chú'],...state.purchases.map(x=>[x.id,x.date,x.vendor,groups[x.group],x.amount,x.paid,x.doc,x.reference||''])])}
function help(){openDialog('Khám phá bản xem trước',`<p>Đây là dữ liệu mẫu của một kỳ tháng 09/2026, không kết nối dữ liệu thật.</p><div class="check-row">1. Thử thêm phiếu mua hoặc chi phí.</div><div class="check-row">2. Mở Kiểm kê, thay đổi tồn cuối và lưu.</div><div class="check-row">3. Xem lợi nhuận cập nhật, xác nhận đối soát và chốt kỳ.</div><div class="check-row">4. Chuyển tab Dòng tiền hoặc Chứng từ & thuế.</div><p class="footnote">Có thể xuất CSV, đổi 6 chủ đề và đặt lại dữ liệu. Bản mẫu chưa hỗ trợ kỳ khác, đính kèm chứng từ hoặc nộp tờ khai.</p>`)}
function resetDemo(){openDialog('Đặt lại dữ liệu mẫu?',`<p>Chỉ xóa các thay đổi bạn đã thử trong bản xem trước trên trình duyệt này.</p><div class="form-actions"><button class="btn" onclick="closeDialog()">Giữ thay đổi</button><button class="btn primary" onclick="state=structuredClone(initial);save();closeDialog();render();toast('Đã khôi phục dữ liệu mẫu.')">Đặt lại</button></div>`)}

</script><script>
'use strict';
// One reconciled illustrative dataset: 64 completed orders, 40m product + 2m delivery revenue.
function distribute(total,weights,unit=1){const target=Math.round(total/unit),ws=weights.reduce((a,b)=>a+b,0);if(!ws)return weights.map(()=>0);const raw=weights.map(x=>target*x/ws),result=raw.map(Math.floor);let left=target-result.reduce((a,b)=>a+b,0);raw.map((x,i)=>({i,r:x-result[i]})).sort((a,b)=>b.r-a.r||a.i-b.i).slice(0,left).forEach(x=>result[x.i]++);return result.map(x=>x*unit)}
const revenueWeights=[60,80,120,90,60,180,170,90,130,100,60,190,230,60,110,90,0,80,190,320,100,70,110,85,130,250,310,140,80,120];
const dailyAmounts=distribute(40000000,revenueWeights,10000);
const categories=[{name:'Bó hoa',color:'var(--chart-main)',product:'Bó hoa tone kem'},{name:'Giỏ hoa',color:'var(--chart-lime)',product:'Giỏ hoa mùa thu'},{name:'Bình & hộp hoa',color:'var(--chart-lilac)',product:'Hộp hoa pastel'},{name:'Kệ hoa',color:'var(--chart-peach)',product:'Kệ hoa chúc mừng'}];
const demoOrders=[];
const daily=Array.from({length:30},(_,i)=>{const day=i+1,count=day===17?0:[6,7,13,20,27,28].includes(day)?3:2;const parts=distribute(dailyAmounts[i],Array.from({length:count},(_,j)=>j+3),10000);const orders=parts.map((product,j)=>{const k=demoOrders.length,cat=k%8<4?0:k%8<6?1:k%8===6?2:3;const shipping=(k+1)%8===0?40000:30000;const order={id:'LM-'+(1001+k),day,product,shipping,actual:shipping+([0,63].includes(k)?-5000:5000),estimated:shipping+(k<20?5000:0),category:cat,time:['09:30','14:00','17:30'][j]};demoOrders.push(order);return order});return{day,orders,product:dailyAmounts[i],shipping:sum(orders,'shipping'),count,weekday:new Date(Date.UTC(2026,8,day)).getUTCDay()}});
let revenueView={from:1,to:30,selected:20,mode:'line',includeShip:false};
const pct=n=>n.toLocaleString('vi-VN',{maximumFractionDigits:1})+'%';
const dayLabel=d=>String(d).padStart(2,'0')+'/09';
function selectedDays(){return daily.filter(d=>d.day>=revenueView.from&&d.day<=revenueView.to)}
function dayValue(d){return d.product+(revenueView.includeShip?d.shipping:0)}
function rangeStats(){const rows=selectedDays(),total=rows.reduce((s,d)=>s+dayValue(d),0),orders=sum(rows,'count'),peak=rows.reduce((best,d)=>dayValue(d)>dayValue(best)?d:best,rows[0]);return{rows,total,orders,average:total/rows.length,orderAverage:orders?total/orders:0,peak,product:sum(rows,'product'),shipping:sum(rows,'shipping')}}
function compactVnd(n){return short(n)+' <small>triệu ₫</small>'}
function spark(values,color='var(--chart-main)',bars=false){const max=Math.max(1,...values);return `<svg class="spark" viewBox="0 0 180 46" aria-hidden="true">${bars?values.map((n,i)=>`<rect x="${i*180/values.length}" y="${43-n/max*37}" width="${Math.max(1,180/values.length-3)}" height="${n/max*37}" rx="2" fill="${color}" opacity="${.3+i/values.length*.7}"/>`).join(''):`<path d="M ${values.map((n,i)=>`${i*180/Math.max(1,values.length-1)},${42-n/max*37}`).join(' L ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`}</svg>`}
function visualMetric(label,value,detail,chart='',accent=false){return `<div class="v-metric ${accent?'v-metric-accent':''}"><div class="v-metric-label">${label}</div><div class="v-metric-value">${value}</div><div class="v-metric-bottom"><span>${detail}</span>${chart}</div></div>`}
function rangeToolbar(){return `<div class="revenue-toolbar"><form class="range-form" onsubmit="applyDateRange(event)"><span class="range-caption">Khoảng báo cáo</span><label><span class="sr-only">Từ ngày</span><input type="date" name="from" value="2026-09-${String(revenueView.from).padStart(2,'0')}" min="2026-09-01" max="2026-09-30" required></label><span class="muted">→</span><label><span class="sr-only">Đến ngày</span><input type="date" name="to" value="2026-09-${String(revenueView.to).padStart(2,'0')}" min="2026-09-01" max="2026-09-30" required></label><button class="btn" type="submit">Áp dụng</button>${revenueView.from!==1||revenueView.to!==30?'<button type="button" class="text-btn" onclick="resetRange()">Cả tháng</button>':''}</form><label class="ship-toggle"><input type="checkbox" ${revenueView.includeShip?'checked':''} onchange="revenueView.includeShip=this.checked;render()"><span>Tính cả phí giao hàng</span></label></div>`}
function applyDateRange(e){e.preventDefault();const f=new FormData(e.target),a=String(f.get('from')),b=String(f.get('to'));if(!/^2026-09-(0[1-9]|[12]\d|30)$/.test(a)||!/^2026-09-(0[1-9]|[12]\d|30)$/.test(b)||a>b)return toast('Chọn khoảng ngày hợp lệ trong tháng 09/2026.');revenueView.from=Number(a.slice(-2));revenueView.to=Number(b.slice(-2));revenueView.selected=Math.min(revenueView.to,Math.max(revenueView.from,revenueView.selected));render();toast('Đã cập nhật doanh thu từ '+dayLabel(revenueView.from)+' đến '+dayLabel(revenueView.to)+'.')}
function resetRange(){revenueView.from=1;revenueView.to=30;render()}
function selectDay(day,focusChart=false){if(day<revenueView.from||day>revenueView.to)return;revenueView.selected=day;render();if(focusChart)document.getElementById('plot-day-'+day)?.focus({preventScroll:true})}
function moveDay(delta){selectDay(Math.min(revenueView.to,Math.max(revenueView.from,revenueView.selected+delta)))}
function chartKey(e,day){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();selectDay(Math.min(revenueView.to,Math.max(revenueView.from,day+(e.key==='ArrowRight'?1:-1))),true)}}
function dailyChart(){const stats=rangeStats(),rows=stats.rows,W=850,H=300,L=56,R=18,T=24,B=44,plotW=W-L-R,plotH=H-T-B,max=Math.max(500000,Math.ceil(Math.max(...rows.map(dayValue))/500000)*500000),step=plotW/rows.length;const x=i=>L+step*(i+.5),y=v=>T+plotH-v/max*plotH;const points=rows.map((d,i)=>[x(i),y(dayValue(d))]);let selected=rows.findIndex(x=>x.day===revenueView.selected);const line='M '+points.map(p=>p.join(',')).join(' L '),fill=line+` L ${points.at(-1)[0]},${y(0)} L ${points[0][0]},${y(0)} Z`;return `<div class="daily-plot" id="daily-plot"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Doanh thu từng ngày từ ${dayLabel(revenueView.from)} đến ${dayLabel(revenueView.to)}. Chọn ngày bằng các nút dưới biểu đồ hoặc dùng bảng số liệu."><defs><linearGradient id="revenue-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--chart-main)" stop-opacity=".23"/><stop offset="100%" stop-color="var(--chart-main)" stop-opacity=".015"/></linearGradient></defs>${Array.from({length:5},(_,i)=>{const v=max*i/4;return `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" class="chart-grid"/><text x="${L-13}" y="${y(v)+4}" text-anchor="end" class="chart-label">${short(v)}</text>`}).join('')}<text x="${L-13}" y="12" class="chart-label" text-anchor="end">triệu ₫</text>${rows.map((d,i)=>d.weekday===0||d.weekday===6?`<rect x="${L+step*i}" y="${T}" width="${step}" height="${plotH}" fill="var(--chart-main)" opacity=".025"/>`:'').join('')}<rect x="${L+step*selected}" y="${T}" width="${step}" height="${plotH}" rx="5" fill="var(--chart-main)" opacity=".07"/>${revenueView.mode==='bar'?rows.map((d,i)=>`<rect class="revenue-bar" x="${x(i)-Math.min(26,step*.58)/2}" y="${y(dayValue(d))}" width="${Math.min(26,step*.58)}" height="${Math.max(dayValue(d)?2:0,plotH*dayValue(d)/max)}" rx="4" fill="${d.day===revenueView.selected?'var(--chart-main)':'var(--chart-lime)'}"/>`).join(''):`<path d="${fill}" fill="url(#revenue-fill)"/><path d="${line}" class="revenue-line"/><g>${points.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${rows[i].day===revenueView.selected?6:2.5}" fill="${rows[i].day===revenueView.selected?'var(--chart-main)':'var(--surface)'}" stroke="var(--chart-main)" stroke-width="2"/>`).join('')}</g>`}<line x1="${x(selected)}" y1="${T}" x2="${x(selected)}" y2="${y(0)}" stroke="var(--chart-main)" stroke-dasharray="4 5" opacity=".5"/>${rows.filter((d,i)=>rows.length<=10||i===0||i===rows.length-1||d.day%5===0).map(d=>{const i=rows.indexOf(d);return `<text x="${x(i)}" y="${H-16}" text-anchor="middle" class="chart-label ${d.day===revenueView.selected?'selected-label':''}">${String(d.day).padStart(2,'0')}</text>`}).join('')}</svg><div class="plot-hits" style="left:${L/W*100}%;right:${R/W*100}%;top:${T/H*100}%;bottom:${B/H*100}%">${rows.map(d=>`<button id="plot-day-${d.day}" class="plot-hit ${d.day===revenueView.selected?'selected':''}" aria-pressed="${d.day===revenueView.selected}" aria-label="Ngày ${dayLabel(d.day)}: ${money(dayValue(d))}, ${d.count} đơn" onkeydown="chartKey(event,${d.day})" onclick="selectDay(${d.day},true)"><span class="plot-tooltip"><b>${dayLabel(d.day)}</b><strong>${money(dayValue(d))}</strong><small>${d.count} đơn đã giao</small></span></button>`).join('')}</div></div>`}
function dayPanel(){const d=daily[revenueView.selected-1],value=dayValue(d),prev=d.day>1?dayValue(daily[d.day-2]):null,delta=prev===null?null:value-prev,ratio=prev?delta/prev*100:null;return `<section class="day-panel" id="selected-day-panel" aria-label="Chi tiết ngày được chọn"><div class="day-panel-top"><span class="eyebrow">NGÀY ĐANG XEM</span><div class="day-nav"><button aria-label="Ngày trước" ${d.day===revenueView.from?'disabled':''} onclick="moveDay(-1)">‹</button><button aria-label="Ngày sau" ${d.day===revenueView.to?'disabled':''} onclick="moveDay(1)">›</button></div></div><label class="day-select-label"><span class="sr-only">Chọn ngày để xem</span><select class="day-select" onchange="selectDay(Number(this.value))">${selectedDays().map(x=>`<option value="${x.day}" ${x.day===d.day?'selected':''}>${['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][x.weekday]}, ${dayLabel(x.day)}</option>`).join('')}</select></label><div class="day-revenue">${compactVnd(value)}</div><div class="day-comparison ${delta===null?'muted':delta>=0?'positive':'negative'}">${prev===null?'Ngày đầu tiên của dữ liệu mẫu':prev===0?value?'Ngày trước không có doanh thu':'Hai ngày đều chưa có doanh thu':`${delta>=0?'↗':'↘'} ${pct(Math.abs(ratio))} so với ngày trước`}</div><div class="day-mini-grid"><div><span>Đơn đã giao</span><b>${d.count}<small> đơn</small></b></div><div><span>Trung bình / đơn</span><b>${d.count?short(value/d.count):'0'}<small> triệu</small></b></div></div><div class="day-breakdown"><div><span>Tiền sản phẩm</span><b>${money(d.product)}</b></div><div><span>Phí giao hàng thu khách</span><b>${money(d.shipping)}</b></div><div class="selected-basis"><span>${revenueView.includeShip?'Tổng doanh thu ngày':'Đang xem: sản phẩm'}</span><b>${money(value)}</b></div></div><button class="btn primary day-detail-button" onclick="openDayDetails(${d.day})">Xem ${d.count} đơn ngày này →</button><p class="day-footnote">Theo ngày giao thực tế.<br>Không phải số tiền nhận trong ngày.</p></section>`}
function chartCard(){const s=rangeStats();return `<section class="card revenue-chart-card"><div class="card-head"><div><h3>Nhịp doanh thu mỗi ngày</h3><p>Chạm vào biểu đồ để xem một ngày cụ thể.</p></div><div class="chart-mode" role="group" aria-label="Kiểu biểu đồ"><button class="${revenueView.mode==='line'?'active':''}" aria-pressed="${revenueView.mode==='line'}" onclick="revenueView.mode='line';render()">Đường</button><button class="${revenueView.mode==='bar'?'active':''}" aria-pressed="${revenueView.mode==='bar'}" onclick="revenueView.mode='bar';render()">Cột</button></div></div><div class="chart-summary"><span class="legend-dot"></span><span>${revenueView.includeShip?'Sản phẩm + phí giao hàng':'Doanh thu sản phẩm thuần'}</span><span class="chart-total">${money(s.total)}</span></div><div class="plot-viewport" id="chart-viewport">${dailyChart()}</div><div class="chart-insight"><span class="insight-mark">↗</span><p><b>${dayLabel(s.peak.day)} là ngày bán tốt nhất</b> trong khoảng chọn, đạt ${money(dayValue(s.peak))} từ ${s.peak.count} đơn.</p></div></section>`}
function revenueMetrics(){const s=rangeStats();return `<div class="v-metrics">${visualMetric(revenueView.includeShip?'Tổng doanh thu':'Doanh thu sản phẩm',compactVnd(s.total),`${s.rows.length} ngày trong khoảng chọn`,spark(s.rows.map(dayValue)),true)}${visualMetric('Đơn đã giao',`${s.orders}<small> đơn</small>`,'Ghi nhận theo ngày giao',spark(s.rows.map(d=>d.count),'var(--chart-lime)',true))}${visualMetric('Trung bình mỗi ngày',compactVnd(s.average),'Gồm cả ngày không có đơn',spark(s.rows.map(dayValue),'var(--chart-lilac)'))}${visualMetric('Ngày cao nhất',compactVnd(dayValue(s.peak)),`${dayLabel(s.peak.day)} · ${s.peak.count} đơn`,spark(s.rows.map(dayValue),'var(--chart-peach)',true))}</div>`}
function calendarCard(){const max=Math.max(...daily.map(dayValue),1);return `<section class="card calendar-card"><div class="card-head"><div><h3>Một tháng, nhìn là hiểu</h3><p>Màu đậm hơn = doanh thu cao hơn · Tháng 09/2026</p></div><span class="calendar-month">09<span>/ 2026</span></span></div><div class="card-body"><div class="revenue-calendar">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="cal-weekday">${x}</div>`).join('')}<span></span>${daily.map(d=>{const value=dayValue(d),level=value===0?0:Math.max(1,Math.ceil(value/max*4)),disabled=d.day<revenueView.from||d.day>revenueView.to;return `<button ${disabled?'disabled':''} class="cal-day level-${level} ${d.day===revenueView.selected?'chosen':''}" aria-pressed="${d.day===revenueView.selected}" aria-label="${dayLabel(d.day)}: ${money(value)}, ${d.count} đơn" onclick="pickCalendarDay(${d.day})"><span>${String(d.day).padStart(2,'0')}</span><b>${value?short(value):'—'}</b></button>`}).join('')}</div><div class="heat-legend"><span>Triệu ₫ / ngày</span><div>Thấp ${[0,1,2,3,4].map(i=>`<i class="level-${i}"></i>`).join('')} Cao</div></div></div></section>`}
function donut(parts,center,caption){const total=parts.reduce((s,p)=>s+p.value,0),r=63,c=2*Math.PI*r;let offset=0;return `<div class="donut-wrap"><svg viewBox="0 0 180 180" role="img" aria-label="${esc(caption)}: ${parts.map(p=>esc(p.label)+' '+money(p.value)).join(', ')}"><circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--soft)" stroke-width="22"/>${parts.map(p=>{const length=total?p.value/total*c:0;const path=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${length} ${c-length}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)"><title>${esc(p.label)}: ${money(p.value)}</title></circle>`;offset+=length;return path}).join('')}</svg><div class="donut-center"><b>${center}</b><span>${caption}</span></div></div>`}
function categoryCard(){const rows=selectedDays().flatMap(d=>d.orders),product=sum(rows,'product'),parts=categories.map((c,i)=>({label:c.name,value:sum(rows.filter(d=>d.category===i),'product'),color:c.color}));return `<section class="card category-card"><div class="card-head"><div><h3>Khách đang chọn hoa gì?</h3><p>Cơ cấu tiền sản phẩm · không gồm phí giao hàng</p></div></div><div class="category-content">${donut(parts,short(product)+' tr','tiền sản phẩm')}<div class="donut-legend">${parts.map(p=>`<div class="donut-legend-row"><span class="color-chip" style="background:${p.color}"></span><div><strong>${p.label}</strong><span>${money(p.value)}</span></div><b>${product?pct(p.value/product*100):'0%'}</b></div>`).join('')}</div></div><div class="category-note">${product?`<b>${parts.reduce((a,b)=>a.value>b.value?a:b).label}</b> đóng góp nhiều nhất trong khoảng ngày bạn chọn.`:'Khoảng ngày này chưa có đơn đã giao.'}</div></section>`}
function revenueTable(){return `<details class="card detail-disclosure"><summary><span><b>Số liệu doanh thu từng ngày</b><small>Dùng khi cần đối soát hoặc xem số tiền chính xác</small></span><span class="disclosure-label">Mở bảng +</span></summary><div class="table-wrap"><table class="data"><thead><tr><th>NGÀY GIAO</th><th class="num">SỐ ĐƠN</th><th class="num">SẢN PHẨM THUẦN</th><th class="num">SHIP THU KHÁCH</th><th class="num">TỔNG DOANH THU</th><th></th></tr></thead><tbody>${selectedDays().map(d=>`<tr><td>${dayLabel(d.day)}/2026</td><td class="num">${d.count}</td><td class="num">${money(d.product)}</td><td class="num">${money(d.shipping)}</td><td class="num">${money(d.product+d.shipping)}</td><td><button class="text-btn" onclick="openDayDetails(${d.day})">Xem đơn</button></td></tr>`).join('')}</tbody></table></div></details>`}
function revenue(){return rangeToolbar()+revenueMetrics()+`<div class="revenue-stage">${chartCard()}${dayPanel()}</div><div class="visual-bottom-grid">${calendarCard()}${categoryCard()}</div>${revenueTable()}<p class="footnote">Doanh thu thuần đã trừ giảm giá / hoàn trả. Dữ liệu mẫu chỉ có đơn đã giao trong tháng 09/2026. Lợi nhuận được tính theo kỳ kiểm kê, không phân bổ tùy ý cho từng ngày.</p>`}
function openDayDetails(day){const d=daily[day-1];openDialog('Đơn đã giao · '+dayLabel(day)+'/2026',`<div class="day-modal-total"><span>Doanh thu sản phẩm</span><b>${money(d.product)}</b></div><p>Phí giao hàng thu khách: ${money(d.shipping)} · ${d.count} đơn</p>${d.count?`<div class="day-orders">${d.orders.map(x=>`<div class="day-order"><span class="order-color" style="background:${categories[x.category].color}">${['B','G','H','K'][x.category]}</span><div><strong>${x.id} · ${categories[x.category].product}</strong><small>Giao ${x.time} · ${dayLabel(day)} · Hoàn thành</small></div><div class="order-values"><b>${money(x.product)}</b><small>Ship: ${money(x.shipping)}</small></div></div>`).join('')}</div>`:'<div class="empty">Không có đơn giao trong ngày này.</div>'}<div class="caption">Đây là doanh thu theo ngày giao, không phải tiền thực nhận. Bản mẫu chưa phân bổ giá vốn theo từng đơn.</div><div class="form-actions"><button class="btn" onclick="closeDialog()">Đóng</button><button class="btn primary" onclick="exportDailyOrders(${day})">↓ Xuất đơn của ngày</button></div>`)}
function exportDailyOrders(day){csv('Lamie-don-ngay-'+day+'-09-2026.csv',[['Mã đơn','Ngày giao','Giờ giao','Nhóm','Sản phẩm thuần','Phí thu khách','Tổng'],...daily[day-1].orders.map(x=>[x.id,dayLabel(day)+'/2026',x.time,categories[x.category].name,x.product,x.shipping,x.product+x.shipping])])}
function waterfall(){const t=totals(),steps=[{label:'Doanh thu',sub:'Sản phẩm + ship',value:42000000,total:true},{label:'Nguyên liệu',sub:'Sản phẩm đã bán',value:-t.cogs},{label:'Hao hụt',sub:'Không trừ lặp lại',value:-state.waste},{label:'Giao hàng',sub:'Chi phí thực tế',value:-2300000},{label:'Vận hành',sub:'Gồm nhân công',value:-t.opex},{label:'Còn lại',sub:'Trước thuế',value:t.profit,total:true}];let running=0;const series=steps.map((d,i)=>{let from=d.total?0:running,to=d.total?d.value:running+d.value;running=to;return{...d,from,to}}),max=Math.max(42000000,...series.flatMap(d=>[d.from,d.to])),min=Math.min(0,...series.flatMap(d=>[d.from,d.to])),W=940,H=310,L=45,R=22,T=38,B=65,plotH=H-T-B,plotW=W-L-R,step=plotW/6,bw=66,y=v=>T+(max-v)/(max-min||1)*plotH;return `<div class="waterfall-scroll"><svg viewBox="0 0 ${W} ${H}" class="waterfall" role="img" aria-label="Doanh thu 42 triệu trừ nguyên liệu ${short(t.cogs)} triệu, hao hụt ${short(state.waste)} triệu, giao hàng 2,3 triệu, vận hành ${short(t.opex)} triệu; còn ${short(t.profit)} triệu trước thuế.">${[0,10e6,20e6,30e6,40e6].filter(v=>v>=min&&v<=max).map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" class="chart-grid"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end" class="chart-label">${short(v)}</text>`).join('')}${min<0?`<line x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}" stroke="var(--ink)"/><text x="${L-10}" y="${y(min)+4}" text-anchor="end" class="chart-label">${short(min)}</text>`:''}<text x="7" y="16" class="chart-label">triệu ₫</text>${series.map((d,i)=>{const x=L+step*(i+.5),top=y(Math.max(d.from,d.to)),height=Math.abs(y(d.from)-y(d.to));return `${i<5?`<line x1="${x+bw/2}" y1="${y(d.to)}" x2="${x+step-bw/2}" y2="${y(d.to)}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".45"/>`:''}<rect x="${x-bw/2}" y="${top}" width="${bw}" height="${Math.max(height,2)}" rx="6" fill="${i===0?'var(--chart-main)':i===5?(d.value>=0?'var(--chart-lime)':'var(--chart-peach)'):i===2?'var(--chart-peach)':'var(--chart-lilac)'}"><title>${d.label}: ${money(d.value)}</title></rect><text x="${x}" y="${top-12}" text-anchor="middle" class="water-value">${d.value>0&&!d.total?'+':''}${short(d.value)}</text><text x="${x}" y="${H-36}" text-anchor="middle" class="water-label">${d.label}</text><text x="${x}" y="${H-16}" text-anchor="middle" class="chart-label">${d.sub}</text>`}).join('')}</svg></div>`}
function costParts(){const t=totals();return[{label:'Nguyên liệu sản phẩm',value:t.cogs,color:'var(--chart-main)'},{label:'Vận hành',value:t.opex,color:'var(--chart-lilac)'},{label:'Giao hàng',value:2300000,color:'var(--chart-lime)'},{label:'Hao hụt',value:state.waste,color:'var(--chart-peach)'}]}
function costCard(){const parts=costParts(),total=parts.reduce((a,b)=>a+b.value,0);return `<section class="card"><div class="card-head"><div><h3>Chi phí nằm ở đâu?</h3><p>Các khoản đã ảnh hưởng đến lợi nhuận tháng 09</p></div></div><div class="category-content">${donut(parts,short(total)+' tr','tổng chi phí')}<div class="donut-legend">${parts.map(p=>`<div class="donut-legend-row"><span class="color-chip" style="background:${p.color}"></span><div><strong>${p.label}</strong><span>${money(p.value)}</span></div><b>${total?pct(p.value/total*100):'0%'}</b></div>`).join('')}</div></div></section>`}
function visualProfit(){const t=totals(),costs=42000000-t.profit;return `<div class="profit-status"><span>${state.closed?'● Kỳ đã chốt':'● Lợi nhuận đang tạm tính'}</span><p>${state.closed?'Đã xác nhận tồn kho, giao hàng và chi phí.':pending()+' bước xác nhận còn lại trước khi chốt tháng.'}</p><button class="text-btn" onclick="go('inventory')">${state.closed?'Xem kiểm kê':'Hoàn tất kiểm kê'} →</button></div><div class="v-metrics">${visualMetric('Tổng doanh thu',compactVnd(42000000),'40 triệu sản phẩm + 2 triệu ship',spark(daily.map(d=>d.product+d.shipping)),true)}${visualMetric('Tổng chi phí',compactVnd(costs),'Đã gồm hao hụt & ship thực tế')}${visualMetric('Lợi nhuận trước thuế',compactVnd(t.profit),state.closed?'Đã chốt số liệu':'Tạm tính · theo kỳ kiểm kê')}${visualMetric('Biên lợi nhuận',`${pct(t.profit/42000000*100)}`,'Trên doanh thu sản phẩm + ship')}</div><section class="card waterfall-card"><div class="card-head"><div><h3>Từ doanh thu đến phần còn lại</h3><p>Mỗi bậc cho thấy một khoản chi làm giảm tiền lãi trong tháng.</p></div>${badge('Tháng 09/2026')}</div>${waterfall()}<div class="waterfall-summary"><span>Từ <b>42 triệu</b> doanh thu</span><span class="flow-arrow">→</span><span>Trừ <b>${short(costs)} triệu</b> chi phí</span><span class="flow-arrow">→</span><strong class="${t.profit<0?'negative':''}">${t.profit<0?'Lỗ':'Còn'} ${short(Math.abs(t.profit))} triệu trước thuế</strong></div></section><div class="visual-bottom-grid">${costCard()}<section class="card shipping-visual"><div class="card-head"><div><h3>Phí giao hàng: đang bù bao nhiêu?</h3><p>Phí tính cho khách so với tiền trả đơn vị giao hàng</p></div></div><div class="card-body"><div class="ship-margin"><strong>−300.000 <small>₫</small></strong>${badge('Tiệm bù thêm','warn')}</div><div class="paired-bar"><div><span>Thu khách</span><b>2 triệu</b></div><i style="--bar:86.9565%;--bar-color:var(--chart-main)"></i></div><div class="paired-bar"><div><span>Chi thực tế</span><b>2,3 triệu</b></div><i style="--bar:100%;--bar-color:var(--chart-peach)"></i></div><div class="shipping-bottom"><span>Vượt dự toán <b>200.000 ₫</b></span><button class="text-btn" onclick="shippingDetail()">Xem đơn giao →</button></div></div></section></div><details class="card detail-disclosure"><summary><span><b>Bảng kết quả kinh doanh chi tiết</b><small>Doanh thu, giá vốn và các khoản chi trong kỳ</small></span><span class="disclosure-label">Mở bảng +</span></summary><div class="card-body">${statement()}<p class="footnote">Giá vốn nguyên liệu không gồm nhân công. Hao hụt tách riêng một lần, không trừ lại tiền mua hàng.</p></div></details>`}
const legacyCash=cash;
cash=function(){const t=totals(),out=t.paid+t.expensePaid+2100000;let markup=legacyCash();const chart=`<section class="card cash-visual"><div class="card-head"><div><h3>Tiền vào, tiền ra, tiền còn lại</h3><p>Theo các khoản thực nhận và đã thanh toán trong tháng</p></div></div><div class="cash-columns">${[['Đầu kỳ',4000000,'var(--chart-lilac)'],['Thực thu',38000000,'var(--chart-main)'],['Thực chi',out,'var(--chart-peach)'],['Cuối kỳ',t.cash,t.cash>=0?'var(--chart-lime)':'var(--chart-peach)']].map(([n,v,c])=>`<div class="cash-column"><div class="cash-number">${compactVnd(v)}</div><div class="cash-track"><div style="height:${Math.max(2,Math.abs(v)/Math.max(38000000,out,Math.abs(t.cash))*100)}%;background:${c}"></div></div><strong>${n}</strong></div>`).join('')}</div><div class="waterfall-summary">4 triệu đầu kỳ <span>+</span> 38 triệu thu <span>−</span> ${short(out)} triệu chi <span>=</span><strong>${short(t.cash)} triệu cuối kỳ</strong></div></section>`;return markup.replace('<div class="grid">',chart+'<div class="grid">')};
report=function(){return heading('LAMIE / FINANCE STUDIO','Nhìn rõ nhịp kinh doanh.','Doanh thu mỗi ngày. Chi phí đúng chỗ. Lợi nhuận rõ ràng.',`<button class="btn" onclick="exportReport()">↓ Xuất ${tab==='revenue'?'doanh thu':'báo cáo'}</button><button class="btn primary" onclick="closePeriod()">${state.closed?'Kỳ đã chốt ✓':'Chốt kỳ tháng 09'}</button>`)+`<div class="tabs report-tabs" role="tablist" aria-label="Báo cáo">${[['revenue','Doanh thu theo ngày'],['profit','Lợi nhuận & chi phí'],['cash','Dòng tiền'],['materials','Nguyên liệu'],['tax','Chứng từ & thuế']].map(([k,n])=>`<button role="tab" aria-selected="${tab===k}" class="tab ${tab===k?'active':''}" onclick="chooseTab('${k}')">${n}</button>`).join('')}</div>`+(tab==='revenue'?'':toolbar())+({revenue,profit:visualProfit,cash,materials,tax}[tab])()};
overview=function(){const t=totals(),s=rangeStats();return heading('LAMIE / TỔNG QUAN','Tiệm hoa hôm nay, trong một góc nhìn.','Bản mẫu theo dõi tháng 09/2026 · Dữ liệu minh họa.',`<button class="btn primary" onclick="chooseTab('revenue')">Khám phá doanh thu →</button>`)+`<div class="overview-ribbon"><div><span class="eyebrow">BỨC TRANH THÁNG 09</span><h2>Mỗi ngày đều có một câu chuyện.</h2><p>64 đơn đã giao · 40 triệu doanh thu sản phẩm</p></div><div class="ribbon-profit"><span>${state.closed?'Lợi nhuận trước thuế':'Lợi nhuận tạm tính'}</span><b>${compactVnd(t.profit)}</b><button onclick="chooseTab('profit')">Xem tiền lãi đến từ đâu →</button></div></div>`+rangeToolbar()+`<div class="revenue-stage">${chartCard()}${dayPanel()}</div><div class="overview-grid">${[['01','Ngày bán tốt nhất',`${dayLabel(s.peak.day)} đạt ${money(dayValue(s.peak))} trong khoảng ngày chọn.`,'revenue','Khám phá doanh thu'],['02','Chi phí & lợi nhuận',`Còn ${pending()} bước xác nhận trước khi chốt tháng.`,'profit','Xem phân bổ chi phí'],['03','Tiền thực có',`${money(t.cash)} số dư cuối kỳ. Theo dõi riêng với doanh thu.`,'cash','Mở dòng tiền']].map(([n,title,desc,p,label])=>`<section class="card overview-step"><div class="step-num">GÓC NHÌN ${n}</div><h3>${title}</h3><p>${desc}</p><button class="text-btn" onclick="chooseTab('${p}')">${label} →</button></section>`).join('')}</div>`};
const legacyExportReport=exportReport;
exportReport=function(){if(tab!=='revenue')return legacyExportReport();csv('Lamie-doanh-thu-ngay-2026-09.csv',[['Dữ liệu mẫu','Theo ngày giao thực tế'],['Từ',dayLabel(revenueView.from),'Đến',dayLabel(revenueView.to)],['Ngày','Số đơn','Sản phẩm thuần','Phí giao hàng thu khách','Tổng doanh thu'],...selectedDays().map(d=>[dayLabel(d.day)+'/2026',d.count,d.product,d.shipping,d.product+d.shipping]),['Tổng',rangeStats().orders,rangeStats().product,rangeStats().shipping,rangeStats().product+rangeStats().shipping]])};
shippingTable=function(){return `<div class="table-wrap"><table class="data"><thead><tr><th>ĐƠN HÀNG</th><th>NGÀY GIAO</th><th class="num">PHÍ THU KHÁCH</th><th class="num">SHIP DỰ KIẾN</th><th class="num">SHIP THỰC TẾ</th><th class="num">THU − CHI</th></tr></thead><tbody>${demoOrders.slice(-3).reverse().map(x=>`<tr><td><strong>${x.id}</strong></td><td>${dayLabel(x.day)}</td><td class="num">${money(x.shipping)}</td><td class="num">${money(x.estimated)}</td><td class="num">${money(x.actual)}</td><td class="num ${x.shipping-x.actual<0?'negative':'positive'}">${money(x.shipping-x.actual)}</td></tr>`).join('')}</tbody></table></div>`};
help=function(){openDialog('Khám phá báo cáo trực quan',`<p>Dữ liệu minh họa tháng 09/2026: 64 đơn, 40 triệu tiền sản phẩm và 2 triệu phí giao hàng.</p><div class="check-row">1. Chọn khoảng ngày, đổi biểu đồ Đường / Cột.</div><div class="check-row">2. Chạm một ngày trên biểu đồ hoặc lịch để xem doanh thu và đơn đã giao.</div><div class="check-row">3. Mở Lợi nhuận & chi phí để xem từng khoản được trừ.</div><div class="check-row">4. Thử nhập chi phí, kiểm kê rồi quay lại xem biểu đồ cập nhật.</div><p class="footnote">Doanh thu theo ngày giao. Lợi nhuận theo kỳ kiểm kê, chưa tính theo từng ngày. Không kết nối dữ liệu thật, không nộp tờ khai.</p>`)};
function pickCalendarDay(day){selectDay(day);document.getElementById('selected-day-panel')?.scrollIntoView({block:'nearest'})}
const legacyMaterials=materials;
materials=function(){const t=totals(),available=3000000+t.buys,parts=[{label:'Vào sản phẩm đã bán',value:t.cogs,color:'var(--chart-main)'},{label:'Hao hụt',value:state.waste,color:'var(--chart-peach)'},{label:'Còn tồn cuối kỳ',value:t.end,color:'var(--chart-lilac)'}];const graph=`<section class="card material-flow"><div class="card-head"><div><h3>Nguyên liệu đã đi đâu?</h3><p>Tồn đầu 3 triệu + mua vào ${short(t.buys)} triệu = ${short(available)} triệu sẵn có trong kỳ</p></div></div><div class="card-body"><div class="material-segments" role="img" aria-label="${parts.map(p=>p.label+': '+money(p.value)).join(', ')}">${parts.map(p=>`<span style="width:${available?p.value/available*100:0}%;background:${p.color}" title="${p.label}: ${money(p.value)}"></span>`).join('')}</div><div class="material-legend">${parts.map(p=>`<div><span class="color-chip" style="background:${p.color}"></span><span>${p.label}</span><b>${short(p.value)} triệu ₫</b><small>${available?pct(p.value/available*100):'0%'}</small></div>`).join('')}</div><div class="caption">${short(t.end)} triệu còn tồn chưa tính vào chi phí. ${short(t.use)} triệu tiêu hao đã bao gồm ${short(state.waste)} triệu hao hụt.</div></div></section>`;return graph+legacyMaterials()};
const renderBeforeCharts=render;
render=function(){const scroller=document.getElementById('chart-viewport'),pos=scroller?.scrollLeft||0;renderBeforeCharts();const next=document.getElementById('chart-viewport');if(next)next.scrollLeft=pos};
render();

</script></body></html>
